name: advance ci-cd pipeline with best practice

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: install dependancies
        run: npm install
      - name: test code
        run: npm test


  build-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: validate-and-test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
      #- name: build-image
       # run: docker build -t my-advance-app:${{ github.sha }} .

      - name: log to aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::875691018539:role/GitHubActionsWorkflowRole
          aws-region: eu-central-1
      - name: log to ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build-image-docker
        run: docker build -t my-advance-app:${{ github.sha }} .

      - name: scan of vulnerabilities with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: my-advance-app:${{ github.sha }}
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"

      - name: push image-docker to ec2
        run: |
          docker tag my-advance-app:${{ github.sha }} ${{ secrets.EC2_REPOSITORY_URI }}:${{ github.sha }}
          docker push ${{ secrets.EC2_REPOSITORY_URI }}:${{ github.sha }}

