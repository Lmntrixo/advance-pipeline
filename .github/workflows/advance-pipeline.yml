name: advance ci-cd pipeline with best practice

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permisions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: install dependancies
        run: npm install
      - name: test code
        run: npm test
      - name: build application
        run: npm run build



  build-image:
    runs-on: ubuntu-latest
    needs: validate-and-test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build-image
        run: docker build -t my-advance-app

      - name: log to aws
        uses: aws-actions/configure-aws-credentials@v4
        with-role-to-assume:
        aws-region: eu-central-1


