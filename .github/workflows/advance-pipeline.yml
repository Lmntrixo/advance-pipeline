name: advance ci-cd pipeline with best practice

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permisions:
  contents: read

job:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: npm
      - name: install dependancies
        run: npm install
      - name: test code
        run: npm test
      - name: build application
        run: npm build



  build-image:
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: build-image
        uses: actions/checkout@v4
        run: docker build -t my-advance-app .

  push-image:
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      id-token: write
      content: read
    steps:
      - name: login to aws
        uses: actions/configure-aws-credentials@v4

      - name: push image on ecr
        run: docker push

